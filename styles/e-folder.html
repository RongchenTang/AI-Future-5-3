<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 E · 风琴文件夹</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root {
      --bg: #f2f1ee; --ink: #1d1d1f; --soft: #77757a; --line: rgba(0,0,0,.08);
      --c1: #f7d774; --c2: #b9dc8c; --c3: #f4a77a; --c4: #9fcdf0; --c5: #f3b4cf; --c6: #c2b3f2; --c7: #8fdcc6; --c8: #f29a8f;
      --title: "Fraunces", "Noto Serif SC", "Songti SC", serif;
      --zh: "Noto Serif SC", "Songti SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Special Elite", "Courier New", monospace;
      --SW: min(620px, 82vw);           /* 纸张宽度 */
      --SH: calc(var(--SW) * .62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { color: var(--ink); background: radial-gradient(circle at 50% 45%, #fff, var(--bg) 70%); font-family: var(--sans); }
    header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 26px; z-index: 30; }
    header b { font-size: 17px; letter-spacing: .02em; } header b span { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--soft); margin-left: 12px; letter-spacing: .15em; }
    header small { color: var(--soft); font-size: 13px; }

    .scene { position: absolute; inset: 0; display: grid; place-items: center; perspective: 1700px; cursor: grab; user-select: none; }
    .scene:active { cursor: grabbing; }
    .rig { position: relative; width: var(--SW); height: var(--SH); transform-style: preserve-3d;
      transform: rotateX(var(--rx, -8deg)) rotateY(var(--ry, -18deg)); transition: transform .9s cubic-bezier(.3,.7,.2,1); }
    .rig.dragging { transition: none; }

    /* 每一页纸 */
    .sheet { position: absolute; inset: 0; border-radius: 14px; transform-style: preserve-3d; cursor: pointer;
      transform: translateZ(calc((var(--n) - var(--i)) * -3px)); transition: transform .8s cubic-bezier(.3,.7,.2,1), box-shadow .3s; }
    .sheet .face { position: absolute; inset: 0; border-radius: 14px; background: var(--c); padding: 22px 26px; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 1px 0 rgba(0,0,0,.04); }
    .sheet .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.15)); }
    .sheet .tab { position: absolute; z-index: 2; top: -28px; left: calc(var(--i) * 11.5% + 2%); height: 30px; padding: 5px 14px; border-radius: 8px 8px 0 0;
      background: var(--c); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .sheet h3 { position: relative; z-index: 1; margin: 0; font-family: var(--title); font-weight: 500; font-size: clamp(16px, 2.4vw, 24px); }
    .sheet .no { position: absolute; right: 26px; top: 26px; z-index: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: rgba(0,0,0,.5); }
    .sheet .peek { position: relative; z-index: 1; margin-top: 10px; display: flex; gap: 10px; }
    .sheet .peek i { flex: 1; height: calc(var(--SH) * .34); border-radius: 8px; background: rgba(255,255,255,.75); }
    .sheet .peek i:nth-child(2) { flex: 1.6; }

    /* 正面口袋（文件夹封面） */
    .pocket { position: absolute; left: -2%; right: -2%; bottom: -6%; height: 78%; transform-origin: bottom center; transform: translateZ(14px);
      transform-style: preserve-3d; transition: transform 1s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
    .pocket .front { position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(180deg, #ffffff, #f4f4f6);
      box-shadow: 0 30px 60px rgba(0,0,0,.12), inset 0 0 0 1px rgba(0,0,0,.05); display: grid; place-items: center; text-align: center; pointer-events: auto; cursor: pointer; }
    .pocket .front p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .25em; color: var(--soft); }
    .pocket .front h1 { margin: 8px 0 4px; font-family: var(--title); font-size: clamp(30px, 5.6vw, 58px); font-weight: 600; letter-spacing: -.02em; line-height: 1; }
    .pocket .front h1 em { font-weight: 400; }
    .pocket .front small { color: var(--soft); font-size: 14px; }
    .pocket .front .clasp { position: absolute; top: -16px; left: 50%; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
    .sides { position: absolute; top: 22%; bottom: 0; width: 0; }

    /* 打开后 */
    .rig.open { --rx: -30deg; translate: 0 70px; }
    .rig.open .pocket .front > div { opacity: 0; transition: opacity .3s; }
    .rig.open .pocket { transform: translateZ(18px) rotateX(-72deg); }
    .rig.open .sheet { transform: translateZ(calc((var(--n) - var(--i)) * -64px)) translateY(calc((var(--n) - var(--i)) * -16px)) rotateX(calc((var(--n) - var(--i)) * 2deg)); }
    .rig.open .sheet:hover { transform: translateZ(calc((var(--n) - var(--i)) * -64px)) translateY(calc((var(--n) - var(--i)) * -16px - 34px)) rotateX(calc((var(--n) - var(--i)) * 2deg)); }
    .rig.open .sheet:hover .face { box-shadow: 0 20px 40px rgba(0,0,0,.12); }

    /* 抽出来的那一页（平面、清晰可读） */
    .pulled { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 70px 20px 90px; background: rgba(242,241,238,.6);
      backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .35s; }
    .pulled.show { opacity: 1; pointer-events: auto; }
    .card { position: relative; width: min(1040px, 100%); max-height: 100%; overflow-y: auto; padding: 56px 56px 44px; border-radius: 22px; background: #fff;
      box-shadow: 0 40px 80px rgba(0,0,0,.14); transform: translateY(60px) scale(.94); transition: transform .5s cubic-bezier(.3,1.25,.5,1); }
    .pulled.show .card { transform: none; }
    .card .ctab { position: absolute; top: 0; left: 56px; padding: 6px 16px; border-radius: 0 0 10px 10px; background: var(--c); font-size: 13px; font-weight: 700; }
    .card .close { position: absolute; top: 18px; right: 20px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #f2f1ee; font-size: 22px; cursor: pointer; }
    .card .k { margin: 16px 0 6px; font-family: var(--mono); font-size: 12px; letter-spacing: .15em; color: var(--soft); }
    .card h2 { margin: 0 0 14px; font-family: var(--zh); font-size: clamp(30px, 4vw, 50px); line-height: 1.15; }
    .card .lead { max-width: 640px; color: #4a4a4f; font-size: 18px; line-height: 1.7; }
    .grid2 { display: grid; grid-template-columns: 300px 1fr; gap: 26px; margin-top: 24px; }
    .sw { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; margin-bottom: 10px; border-radius: 14px; background: color-mix(in srgb, var(--c) 30%, #fff); cursor: pointer; }
    .sw b { display: block; font-size: 19px; } .sw small { color: var(--soft); }
    .knob { width: 46px; height: 26px; border-radius: 99px; background: #ddd; position: relative; transition: .25s; flex: none; }
    .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .25s; }
    .sw.on .knob { background: var(--ink); } .sw.on .knob::after { left: 23px; }
    .browser { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
    .browser .bar { padding: 10px 14px; background: #f6f6f7; font-family: var(--mono); font-size: 11px; color: var(--soft); }
    .demo { padding: 30px; min-height: 260px; }
    .demo.styled { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, #fff), #fff); }
    .demo.styled h4 { margin: 0; font-family: var(--zh); font-size: 34px; }
    .demo.styled p { color: var(--soft); }
    .demo.styled .tags span { display: inline-block; margin: 0 6px 6px 0; padding: 4px 12px; border-radius: 99px; background: #fff; font-size: 14px; font-weight: 700; }
    .demo.styled button { margin-top: 8px; padding: 10px 22px; border: 0; border-radius: 99px; background: var(--ink); color: #fff; font: inherit; }
    .demo:not(.styled), .demo:not(.styled) * { all: revert; font-family: "Times New Roman", serif; }
    .rules { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 24px; }
    .rules div { padding: 20px 18px; border-radius: 16px; background: color-mix(in srgb, var(--c) 28%, #fff); }
    .rules b { display: block; font-family: var(--mono); font-size: 12px; color: var(--soft); }
    .rules h4 { margin: 26px 0 6px; font-family: var(--zh); font-size: 20px; }
    .rules p { margin: 0; font-size: 14.5px; color: #4a4a4f; line-height: 1.6; }

    .hint { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 13px; color: var(--soft); z-index: 20; }
    .chips { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; z-index: 45; }
    .chips button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border: 0; border-radius: 99px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); font: 13px var(--sans); cursor: pointer; }
    .chips button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

    @media (max-width: 760px) {
      .grid2, .rules { grid-template-columns: 1fr; }
      .card { padding: 48px 20px 28px; }
      .sheet .tab { font-size: 10px; padding: 6px 7px; left: calc(var(--i) * 12% + 1%); }
      .chips { bottom: 10px; } .chips button { font-size: 12px; padding: 5px 10px; }
      .hint { bottom: 92px; }
      header small { display: none; }
    }
  </style>
</head>
<body>
  <header><b>AI &amp; Future<span>5-3 · WEB DESIGN</span></b><small>人工智能与未来 · 网站构建</small></header>

  <div class="scene" id="scene">
    <div class="rig" id="rig"></div>
  </div>
  <p class="hint" id="hint">拖动可以旋转 · 点击文件夹打开</p>
  <nav class="chips" id="chips"></nav>

  <div class="pulled" id="pulled"><div class="card" id="card"></div></div>

  <script>
    const SECTIONS = [
      { tab: "职业之书", en: "The Book of Paths", c: "--c1", body: `<p class="k">01 · ICEBREAKER</p><h2>先翻开一本书，<br>找找你想走的路</h2><p class="lead">扫码完成 18 道情境题，看看你属于霍兰德六种类型中的哪一种，并拿到一张"你的网站可以长这样"的票根。</p>` },
      { tab: "个人网站", en: "Why a Website", c: "--c2", body: `<p class="k">02 · WHY</p><h2>简历让你被筛选，<br>网站让你被记住</h2><p class="lead">一起看 4 个优秀的个人网站：它们第一眼让你看到了什么？是怎么组织经历、作品和风格的？</p>` },
      { tab: "三件套", en: "HTML · CSS · JS", c: "--c4", lab: true },
      { tab: "设计原则", en: "Five Rules", c: "--c5", rules: true },
      { tab: "提示词", en: "Prompt Studio", c: "--c6", body: `<p class="k">05 · PROMPT</p><h2>把设计原则<br>写进提示词</h2><p class="lead">把测试拿到的定位粘贴进来，填上你的经历和素材，一键生成可以直接交给 AI 的完整提示词。</p>` },
      { tab: "动手实践", en: "Make It", c: "--c7", body: `<p class="k">06 · PRACTICE</p><h2>30 分钟，<br>做出你的网站初稿</h2><p class="lead">AI 负责生成，人负责判断。做完用自查表检查一遍，再请 AI 修改。</p>` },
      { tab: "总结", en: "Say Hi", c: "--c8", body: `<p class="k">07 · WRAP UP</p><h2>从内容到网页，<br>下一站：应用构建</h2><p class="lead">真正决定网页质量的，是你的结构意识、审美判断和迭代能力。</p>` }
    ];
    const N = SECTIONS.length;
    const rig = document.getElementById("rig");

    rig.innerHTML = SECTIONS.map((s, i) => `
      <div class="sheet" data-i="${i}" style="--i:${i};--n:${N - 1};--c:var(${s.c})">
        <span class="tab">${s.tab}</span><div class="face"><h3>${s.en}</h3><span class="no">0${i + 1} · ${s.tab}</span>
          <div class="peek"><i></i><i></i><i></i></div></div>
      </div>`).reverse().join("") + `
      <div class="pocket"><div class="front"><span class="clasp"></span><div><p>AI · FUTURE · 5-3</p><h1>Web <em>Design</em></h1><small>网站构建：从内容到数字呈现</small></div></div></div>`;
    // 翻转顺序：第 1 页在最前面
    rig.querySelectorAll(".sheet").forEach((el) => { const i = Number(el.dataset.i); el.style.setProperty("--i", N - 1 - i); el.querySelector(".tab").style.left = `calc(${i} * 13.5% + 1%)`; });

    document.getElementById("chips").innerHTML = SECTIONS.map((s, i) => `<button type="button" data-i="${i}" style="--c:var(${s.c})"><i></i>${s.tab}</button>`).join("");

    function openFolder() { rig.classList.add("open"); hint.textContent = "拖动旋转 · 点击任意一页把它抽出来 · Esc 合上"; }
    rig.querySelector(".pocket .front").addEventListener("click", (e) => { e.stopPropagation(); openFolder(); });

    let moved = false;
    rig.addEventListener("click", (e) => {
      if (moved) return;
      const sh = e.target.closest(".sheet");
      if (!rig.classList.contains("open")) return openFolder();
      if (sh) pull(Number(sh.dataset.i));
    });
    chips.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { openFolder(); pull(Number(b.dataset.i)); } });

    function pull(i) {
      const s = SECTIONS[i];
      card.style.setProperty("--c", `var(${s.c})`);
      let body = s.body || "";
      if (s.lab) body = `<p class="k">03 · BASICS</p><h2>网页由什么构成？</h2><p class="lead">打开开关，看看 HTML、CSS、JavaScript 各自负责什么。</p>
        <div class="grid2"><div>
          <div class="sw on"><div><b>HTML</b><small>骨架：页面里有什么</small></div><span class="knob"></span></div>
          <div class="sw on" data-css><div><b>CSS</b><small>衣服：页面长什么样</small></div><span class="knob"></span></div>
          <div class="sw on"><div><b>JavaScript</b><small>机关：页面能做什么</small></div><span class="knob"></span></div></div>
          <div class="browser"><div class="bar">my-website.html</div><div class="demo styled" id="demo"><h4>小林的个人网站</h4><p>数据分析方向 · 喜欢把复杂的事情讲清楚</p><div class="tags"><span>Excel</span><span>Python</span><span>调研</span></div><button>了解更多</button></div></div></div>`;
      if (s.rules) body = `<p class="k">04 · DESIGN</p><h2>五条设计原则</h2><p class="lead">AI 负责生成，人负责判断。</p><div class="rules">
        <div><b>01</b><h4>视觉定位</h4><p>先想好气质，再动手。风格就是第一印象。</p></div>
        <div><b>02</b><h4>信息层级</h4><p>3 秒内，让别人看懂你是谁。</p></div>
        <div><b>03</b><h4>用户路径</h4><p>我是谁 → 擅长什么 → 做过什么 → 怎么找我</p></div>
        <div><b>04</b><h4>视觉统一</h4><p>颜色不超过 3 种，字体不超过 2 种。</p></div>
        <div><b>05</b><h4>留白对齐</h4><p>信息越多，越需要留白和对齐。</p></div></div>`;
      card.innerHTML = `<span class="ctab">${s.tab}</span><button class="close" type="button" aria-label="放回去">×</button>${body}`;
      card.querySelector(".close").onclick = close;
      card.querySelectorAll(".sw").forEach((sw) => sw.onclick = () => { sw.classList.toggle("on"); if (sw.hasAttribute("data-css")) document.getElementById("demo").classList.toggle("styled", sw.classList.contains("on")); });
      pulled.classList.add("show");
    }
    function close() { pulled.classList.remove("show"); }
    pulled.addEventListener("click", (e) => { if (e.target === pulled) close(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape") { if (pulled.classList.contains("show")) close(); else { rig.classList.remove("open"); hint.textContent = "拖动可以旋转 · 点击文件夹打开"; } } });

    // 拖动旋转
    let sx, sy, rx0, ry0, dragging = false;
    const num = (v, d) => parseFloat(getComputedStyle(rig).getPropertyValue(v)) || d;
    scene.addEventListener("pointerdown", (e) => { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; rx0 = num("--rx", -8); ry0 = num("--ry", -18); });
    addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; rig.classList.add("dragging"); }
      if (!moved) return;
      rig.style.setProperty("--ry", Math.max(-60, Math.min(60, ry0 + dx * 0.25)) + "deg");
      rig.style.setProperty("--rx", Math.max(-60, Math.min(20, rx0 - dy * 0.2)) + "deg");
    });
    addEventListener("pointerup", () => { dragging = false; rig.classList.remove("dragging"); setTimeout(() => moved = false, 0); });
  </script>
</body>
</html>
